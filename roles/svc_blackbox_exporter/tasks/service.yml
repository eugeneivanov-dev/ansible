---
- name: Deploy blackbox_exporter systemd unit
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart blackbox_exporter

- name: Enable and start blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    enabled: true
    state: started

# Listener contract, asserted by fact. The unit declares a loopback-only
# listener; the check reads what the kernel actually has bound. Handlers are
# flushed first: a pending restart would otherwise run at the end of the play,
# after this check had looked at the old process.
- name: Listener contract
  vars:
    svc_blackbox_exporter_listen_host: "{{ svc_blackbox_exporter_listen_address | split(':') | first }}"
    svc_blackbox_exporter_listen_port: "{{ svc_blackbox_exporter_listen_address | split(':') | last }}"
  block:
    - name: Apply a pending blackbox_exporter restart before the listener check
      ansible.builtin.meta: flush_handlers

    - name: Wait for the blackbox_exporter listener
      community.general.listen_ports_facts:
        command: ss
      register: svc_blackbox_exporter_listen
      until: >-
        svc_blackbox_exporter_listen.ansible_facts.tcp_listen
        | selectattr('port', 'equalto', svc_blackbox_exporter_listen_port | int)
        | list | length > 0
      retries: 12
      delay: 5

    - name: Assert blackbox_exporter listens on the loopback only
      ansible.builtin.assert:
        that:
          - svc_blackbox_exporter_listen_found | reject('equalto', svc_blackbox_exporter_listen_host) | list | length == 0
        fail_msg: >-
          blackbox_exporter listens on {{ svc_blackbox_exporter_listen_found }} for port
          {{ svc_blackbox_exporter_listen_port }}, expected {{ svc_blackbox_exporter_listen_address }}
        quiet: true
      vars:
        svc_blackbox_exporter_listen_found: >-
          {{ svc_blackbox_exporter_listen.ansible_facts.tcp_listen
             | selectattr('port', 'equalto', svc_blackbox_exporter_listen_port | int)
             | map(attribute='address') | unique | list }}
