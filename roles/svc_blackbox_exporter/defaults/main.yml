---
# Pinned upstream release. Version and checksum move together:
# both come from https://github.com/prometheus/blackbox_exporter/releases
# (linux-amd64 tarball, sha256sums.txt of the release).
svc_blackbox_exporter_version: "0.28.0"
svc_blackbox_exporter_checksum: "sha256:caf5d242fb1cf6d5cb678f3f799f22703d4fafea26b03dcbbd7e1f1825e06329"
svc_blackbox_exporter_install_dir: /opt/blackbox_exporter
svc_blackbox_exporter_config_dir: /etc/blackbox_exporter

# The exporter serves Prometheus on the same host only: loopback listener,
# no firewall exposure. Prometheus reaches probes via 127.0.0.1:9115.
svc_blackbox_exporter_listen_address: "127.0.0.1:9115"

# Probe timeouts: below the 15s scrape interval with air to spare.
svc_blackbox_exporter_probe_timeout: 5s

# DNS probe parameters: what to resolve and which record type.
# The actual name is a lab fact; per-target servers come from vault targets.
svc_blackbox_exporter_dns_query_name: "monitor.lab.eugeneivanov.dev"
svc_blackbox_exporter_dns_query_type: "A"
