---
- name: Download Loki release archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ svc_loki_version }}/loki-linux-amd64.zip"
    dest: "/opt/loki-{{ svc_loki_version }}.linux-amd64.zip"
    checksum: "{{ svc_loki_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Create versioned Loki release directory
  ansible.builtin.file:
    path: "/opt/loki-{{ svc_loki_version }}.linux-amd64"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack Loki release
  ansible.builtin.unarchive:
    src: "/opt/loki-{{ svc_loki_version }}.linux-amd64.zip"
    dest: "/opt/loki-{{ svc_loki_version }}.linux-amd64"
    remote_src: true
    creates: "/opt/loki-{{ svc_loki_version }}.linux-amd64/loki-linux-amd64"
    owner: root
    group: root
    mode: "0755"

- name: Link current Loki release
  ansible.builtin.file:
    src: "/opt/loki-{{ svc_loki_version }}.linux-amd64"
    dest: "{{ svc_loki_install_dir }}"
    state: link
  notify: Restart loki
