---
- name: Deploy SSH hardening drop-in
  ansible.builtin.copy:
    src: 99-hardening.conf
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Ensure sshd is enabled and started
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: started

- name: Flush handlers before policy verification
  ansible.builtin.meta: flush_handlers

- name: Collect effective sshd policy
  ansible.builtin.command: /usr/sbin/sshd -T
  register: rhel_ssh_hardening_effective
  changed_when: false
  check_mode: false

- name: Assert effective sshd policy matches hardening
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in rhel_ssh_hardening_effective.stdout"
      - "'permitrootlogin no' in rhel_ssh_hardening_effective.stdout"
      - "'pubkeyauthentication yes' in rhel_ssh_hardening_effective.stdout"
      - "'kbdinteractiveauthentication no' in rhel_ssh_hardening_effective.stdout"
    fail_msg: Effective sshd policy does not match the hardening baseline
