---
groups:
  - name: prometheus
    rules:
      - alert: PrometheusTargetScrapeFailing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.instance }} (job {{ $labels.job }}) failing"
          description: >-
            Target {{ $labels.instance }} of job {{ $labels.job }} has not
            been scraped successfully for 5 minutes.

      - alert: PrometheusTsdbNearRetentionSize
        expr: >-
          prometheus_tsdb_storage_blocks_bytes
          > 0.8 * (40 * 1024 * 1024 * 1024)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB approaching retention.size fuse"
          description: >-
            TSDB block storage on {{ $labels.instance }} exceeds 80% of the
            40GB retention.size limit; size-based deletion will begin soon.
            Review cardinality or disk sizing.

      - alert: PrometheusRestartingTooOften
        expr: changes(process_start_time_seconds{job="prometheus"}[1h]) > 2
        labels:
          severity: critical
        annotations:
          summary: "Prometheus on {{ $labels.instance }} restarting repeatedly"
          description: >-
            The Prometheus process restarted more than twice in the last
            hour — possible crash loop.
