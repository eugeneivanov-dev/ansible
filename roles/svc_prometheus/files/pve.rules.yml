---
groups:
  - name: pve
    rules:
      - alert: PveNodeDown
        expr: max by (id) (pve_up{id=~"node/.*"}) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox node {{ $labels.id }} is down"
          description: >-
            The Proxmox API reports node {{ $labels.id }}
            as offline for 3 minutes.

      - alert: PveVmDown
        expr: max by (id) (pve_up{id=~"qemu/.*", id!="qemu/150"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.id }} is down"
          description: >-
            VM {{ $labels.id }} has been reported stopped by the Proxmox API
            for 5 minutes. CML (qemu/150) is excluded as an on-demand guest.

      - alert: PveStorageFillingUp
        expr: >-
          max by (id) (
            pve_disk_usage_bytes{id=~"storage/.*"}
            / pve_disk_size_bytes{id=~"storage/.*"}
          ) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox storage {{ $labels.id }} above 85%"
          description: >-
            Storage {{ $labels.id }} has been over 85% full for 15 minutes.

      - alert: PveStorageCritical
        expr: >-
          max by (id) (
            pve_disk_usage_bytes{id=~"storage/.*"}
            / pve_disk_size_bytes{id=~"storage/.*"}
          ) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox storage {{ $labels.id }} above 95%"
          description: >-
            Storage {{ $labels.id }} has been over 95% full for 5 minutes —
            VM disks and backups are at risk.

      - alert: PveReplicationStale
        expr: >-
          max by (id) (
            time() - pve_replication_last_sync_timestamp_seconds
          ) > 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox replication job {{ $labels.id }} is stale"
          description: >-
            Replication job {{ $labels.id }} has not completed a sync
            for over an hour (schedule is every 15 minutes) — ZFS replicas
            are falling behind, HA failover would lose recent data.
