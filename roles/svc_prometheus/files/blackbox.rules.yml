---
groups:
  - name: blackbox
    rules:
      - alert: ProbeFailedHttps
        expr: probe_success{job="blackbox-https"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "HTTPS probe failed for {{ $labels.instance }}"
          description: >-
            The https_2xx probe against {{ $labels.instance }}
            (group {{ $labels.group }}) has been failing for 3 minutes.

      - alert: ProbeFailedHttp
        expr: probe_success{job="blackbox-http"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failed for {{ $labels.instance }}"
          description: >-
            The http_2xx probe against {{ $labels.instance }}
            (group {{ $labels.group }}) has been failing for 3 minutes.

      - alert: ProbeFailedTcp
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "TCP probe failed for {{ $labels.instance }}"
          description: >-
            The tcp_connect probe against {{ $labels.instance }}
            (group {{ $labels.group }}) has been failing for 3 minutes.

      - alert: ProbeFailedDns
        expr: probe_success{job="blackbox-dns"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "DNS probe failed for {{ $labels.instance }}"
          description: >-
            The dns probe against {{ $labels.instance }}
            (group {{ $labels.group }}) has been failing for 3 minutes.

      - alert: SlowProbe
        expr: avg_over_time(probe_duration_seconds{job=~"blackbox-.*"}[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Probe of {{ $labels.instance }} is slow"
          description: >-
            The {{ $labels.job }} probe against {{ $labels.instance }}
            has averaged over 1 second for the last 10 minutes.

      - alert: SSLCertExpiringSoon
        expr: >-
          probe_ssl_earliest_cert_expiry{job="blackbox-https",
          group!~"grafana|step-ca|pve1|pve2|nas2"} - time() < 14 * 24 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires within 14 days"
          description: >-
            The certificate served by {{ $labels.instance }}
            (group {{ $labels.group }}) expires in under 14 days.

      - alert: SSLCertShortLivedExpiring
        expr: >-
          probe_ssl_earliest_cert_expiry{job="blackbox-https",
          group=~"grafana|pve1|pve2|nas2"} - time() < 2 * 24 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Short-lived TLS certificate for {{ $labels.instance }} expires within 2 days"
          description: >-
            The 7-day certificate at {{ $labels.instance }}
            (group {{ $labels.group }}) expires in under 2 days —
            automated renewal has likely been failing for days.

      - alert: SSLCertDailyExpiring
        expr: >-
          probe_ssl_earliest_cert_expiry{job="blackbox-https",
          group="step-ca"} - time() < 6 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Daily-cycle TLS certificate for {{ $labels.instance }} expires within 6 hours"
          description: >-
            The one-day certificate at {{ $labels.instance }}
            (group {{ $labels.group }}) expires in under 6 hours —
            step-ca has not renewed its own listener certificate today.
