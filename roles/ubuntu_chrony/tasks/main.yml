---
- name: Ensure systemd-timesyncd is removed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    purge: true

- name: Ensure chrony package is installed
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Deploy chrony.conf from template
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is enabled and started
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
