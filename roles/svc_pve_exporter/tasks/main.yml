---
# svc_pve_exporter: Proxmox VE metrics exporter.
# Python package in a dedicated venv; multi-target instance on localhost.

- name: Svc_pve_exporter | Create service group
  ansible.builtin.group:
    name: "{{ svc_pve_exporter_group }}"
    system: true

- name: Svc_pve_exporter | Create service user
  ansible.builtin.user:
    name: "{{ svc_pve_exporter_user }}"
    group: "{{ svc_pve_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ svc_pve_exporter_base_dir }}"
    create_home: false

- name: Svc_pve_exporter | Create base directory
  ansible.builtin.file:
    path: "{{ svc_pve_exporter_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Svc_pve_exporter | Install pip module dependency
  ansible.builtin.dnf:
    name: python3-packaging
    state: present

- name: Svc_pve_exporter | Install exporter into venv
  ansible.builtin.pip:
    name: "prometheus-pve-exporter=={{ svc_pve_exporter_version }}"
    virtualenv: "{{ svc_pve_exporter_venv_dir }}"
    virtualenv_command: "python3 -m venv"

- name: Svc_pve_exporter | Create config directory
  ansible.builtin.file:
    path: "{{ svc_pve_exporter_config_dir }}"
    state: directory
    owner: root
    group: "{{ svc_pve_exporter_group }}"
    mode: "0750"

- name: Svc_pve_exporter | Deploy exporter config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: "{{ svc_pve_exporter_config_file }}"
    owner: root
    group: "{{ svc_pve_exporter_group }}"
    mode: "0640"
  notify: Svc_pve_exporter | Restart pve_exporter

- name: Svc_pve_exporter | Deploy systemd unit
  ansible.builtin.template:
    src: pve_exporter.service.j2
    dest: /etc/systemd/system/pve_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Svc_pve_exporter | Restart pve_exporter

- name: Svc_pve_exporter | Enable and start pve_exporter
  ansible.builtin.systemd_service:
    name: pve_exporter
    state: started
    enabled: true
    daemon_reload: true

# Listener contract, asserted by fact. The unit declares a loopback-only
# listener; the check reads what the kernel actually has bound. Handlers are
# flushed first: a pending restart would otherwise run at the end of the play,
# after this check had looked at the old process.
- name: Svc_pve_exporter | Listener contract
  block:
    - name: Svc_pve_exporter | Apply a pending restart before the listener check
      ansible.builtin.meta: flush_handlers

    - name: Svc_pve_exporter | Wait for the pve_exporter listener
      community.general.listen_ports_facts:
        command: ss
      register: svc_pve_exporter_listen
      until: >-
        svc_pve_exporter_listen.ansible_facts.tcp_listen
        | selectattr('port', 'equalto', svc_pve_exporter_listen_port | int)
        | list | length > 0
      retries: 12
      delay: 5

    - name: Svc_pve_exporter | Assert pve_exporter listens on the loopback only
      ansible.builtin.assert:
        that:
          - svc_pve_exporter_listen_found | reject('equalto', svc_pve_exporter_listen_address) | list | length == 0
        fail_msg: >-
          pve_exporter listens on {{ svc_pve_exporter_listen_found }} for port
          {{ svc_pve_exporter_listen_port }}, expected {{ svc_pve_exporter_listen_address }}:{{ svc_pve_exporter_listen_port }}
        quiet: true
      vars:
        svc_pve_exporter_listen_found: >-
          {{ svc_pve_exporter_listen.ansible_facts.tcp_listen
             | selectattr('port', 'equalto', svc_pve_exporter_listen_port | int)
             | map(attribute='address') | unique | list }}
