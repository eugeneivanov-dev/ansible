---
- name: Deploy SSH hardening drop-in
  ansible.builtin.copy:
    src: 00-lab-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure ssh socket activation is disabled
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  register: ubuntu_ssh_hardening_socket

# Ordered transition: both tasks must run before ssh.service starts,
# so they cannot be handlers (handlers fire after flush).
- name: Reload systemd after disabling socket activation  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ubuntu_ssh_hardening_socket is changed

- name: Terminate orphaned socket-activated sshd listener  # noqa: no-handler
  ansible.builtin.command: pkill -f 'sshd.*\[listener\]'
  when: ubuntu_ssh_hardening_socket is changed
  register: ubuntu_ssh_hardening_pkill
  changed_when: ubuntu_ssh_hardening_pkill.rc == 0
  failed_when: ubuntu_ssh_hardening_pkill.rc not in [0, 1]

- name: Ensure ssh service is enabled and started
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: Flush handlers before policy verification
  ansible.builtin.meta: flush_handlers

- name: Collect effective sshd policy
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ubuntu_ssh_hardening_effective
  changed_when: false
  check_mode: false

- name: Assert effective sshd policy matches hardening
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in ubuntu_ssh_hardening_effective.stdout"
      - "'permitrootlogin no' in ubuntu_ssh_hardening_effective.stdout"
      - "'pubkeyauthentication yes' in ubuntu_ssh_hardening_effective.stdout"
      - "'kbdinteractiveauthentication no' in ubuntu_ssh_hardening_effective.stdout"
    fail_msg: Effective sshd policy does not match the hardening baseline
