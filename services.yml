---
# Services layer — infrastructure services on top of the OS baseline (site.yml).
# Roles arrive per phase: svc_blackbox_exporter, svc_pve_exporter,
# svc_prometheus, svc_alertmanager, svc_loki, svc_grafana. Exporters precede
# Prometheus so that a clean run brings scrape endpoints up before
# anything scrapes them; Loki precedes Grafana, which consumes it as a
# datasource.

- name: Monitoring stack
  hosts: monitoring
  become: true
  roles:
    - svc_blackbox_exporter
    - svc_pve_exporter
    - svc_prometheus
    - svc_alertmanager
    - svc_loki
    - svc_grafana
