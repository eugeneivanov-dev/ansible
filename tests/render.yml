---
# CI render check: render the monitoring config templates with role
# defaults plus fixture vault values (tests/render-vars.yml), so that
# promtool / amtool can validate the results. Run from the repo root:
#   ansible-playbook tests/render.yml
# Output: /tmp/rendered/prometheus.yml, /tmp/rendered/alertmanager.yml,
# /tmp/rendered/blackbox.yml, /tmp/rendered/blackbox_*.json,
# /tmp/rendered/pve.yml, /tmp/rendered/pve.json,
# /tmp/rendered/loki.yml, /tmp/rendered/config.alloy

- name: Render monitoring config templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
    - ../roles/svc_prometheus/defaults/main.yml
    - ../roles/svc_alertmanager/defaults/main.yml
    - ../roles/svc_blackbox_exporter/defaults/main.yml
    - ../roles/svc_pve_exporter/defaults/main.yml
    - ../roles/svc_loki/defaults/main.yml
    - ../roles/rhel_log_agent/defaults/main.yml
    - render-vars.yml
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/rendered
        state: directory
        mode: "0755"

    - name: Render prometheus.yml
      ansible.builtin.template:
        src: ../roles/svc_prometheus/templates/prometheus.yml.j2
        dest: /tmp/rendered/prometheus.yml
        mode: "0644"

    - name: Render alertmanager.yml
      ansible.builtin.template:
        src: ../roles/svc_alertmanager/templates/alertmanager.yml.j2
        dest: /tmp/rendered/alertmanager.yml
        mode: "0644"

    - name: Render blackbox.yml
      ansible.builtin.template:
        src: ../roles/svc_blackbox_exporter/templates/blackbox.yml.j2
        dest: /tmp/rendered/blackbox.yml
        mode: "0644"

    - name: Render blackbox probe target files
      ansible.builtin.template:
        src: "../roles/svc_prometheus/templates/blackbox_{{ item }}_targets.json.j2"
        dest: "/tmp/rendered/blackbox_{{ item }}.json"
        mode: "0644"
      loop:
        - https
        - https_insecure
        - http
        - tcp
        - dns

    - name: Render pve exporter config
      ansible.builtin.template:
        src: ../roles/svc_pve_exporter/templates/pve.yml.j2
        dest: /tmp/rendered/pve.yml
        mode: "0644"

    - name: Render pve exporter targets
      ansible.builtin.template:
        src: ../roles/svc_prometheus/templates/pve_targets.json.j2
        dest: /tmp/rendered/pve.json
        mode: "0644"

    - name: Render loki.yml
      ansible.builtin.template:
        src: ../roles/svc_loki/templates/loki.yml.j2
        dest: /tmp/rendered/loki.yml
        mode: "0644"

    - name: Render alloy agent config
      ansible.builtin.template:
        src: ../roles/rhel_log_agent/templates/config.alloy.j2
        dest: /tmp/rendered/config.alloy
        mode: "0644"
